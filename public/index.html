<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Transporte - Cooperativa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">🚍 Gestión de Pasajes</h1>

    <div class="card mb-4 border-primary">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <span id="tituloFormulario">Venta de Pasaje</span>
            <button id="btnCancelar" class="btn btn-sm btn-light" style="display: none;" onclick="resetFormulario()">Cancelar Edición</button>
        </div>
        <div class="card-body">
            <form id="formPasaje">
                <input type="hidden" id="id_pasaje">

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label>Ruta</label>
                        <select class="form-select" id="id_ruta" required onchange="calcularPrecio()">
                            <option value="" data-precio="0">Seleccione...</option>
                            <option value="1" data-precio="4.00">Ruta Norte (Ibarra - Quito)</option>
                            <option value="2" data-precio="12.00">Ruta Pacífico (Quito - Esmeraldas)</option>
                            <option value="3" data-precio="18.50">Ruta Sur (Quito - Huaquillas)</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Unidad (Bus)</label>
                        <select class="form-select" id="id_unidad" required>
                            <option value="">Seleccione...</option>
                            <option value="1">Unidad 10 (Mercedes)</option>
                            <option value="2">Unidad 25 (Hino)</option>
                            <option value="3">Unidad 05 (Volvo)</option>
                        </select>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label>Tipo Pasaje</label>
                        <select class="form-select" id="id_tipo" required onchange="calcularPrecio()">
                            <option value="" data-descuento="0">Seleccione...</option>
                            <option value="1" data-descuento="0">Normal (0% Desc)</option>
                            <option value="2" data-descuento="0.5">Estudiantil (50% Desc)</option>
                            <option value="3" data-descuento="0.5">Tercera Edad (50% Desc)</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label>Cédula</label>
                        <input type="text" class="form-control" id="cedula" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label>Nombre Cliente</label>
                        <input type="text" class="form-control" id="nombre" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label>Asiento</label>
                        <input type="number" class="form-control" id="asiento" required>
                    </div>
                    
                    <div class="col-md-2 mb-3">
                        <label>Fecha Viaje</label>
                        <input type="datetime-local" class="form-control" id="fecha_viaje" required>
                    </div>

                    <div class="col-md-2 mb-3">
                        <label>Valor ($)</label>
                        <input type="number" step="0.01" class="form-control bg-light" id="valor" required readonly>
                    </div>
                    
                    <div class="col-md-12 text-end">
                        <button type="submit" class="btn btn-success w-100" id="btnGuardar">💾 Guardar Pasaje</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <input type="text" id="filtroRuta" class="form-control" placeholder="🔍 Filtrar por nombre de ruta...">
        </div>
        <div class="col-md-6 text-end">
            <button class="btn btn-success" onclick="descargarCSV()">📄 Descargar CSV</button>
            <button class="btn btn-secondary" onclick="cargarPasajes()">🔄 Actualizar Tabla</button>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Ruta</th>
                        <th>N° Unidad</th>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tablaPasajes">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
